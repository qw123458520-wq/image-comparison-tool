name: Build and Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 打包 macOS 应用
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: ImageComparisonTool-macOS
          path: |
            release/*.zip
            release/*.dmg
          retention-days: 30
